{% extends "base.html" %}
{% block title %}登录 - AI 用药伴侣{% endblock %}
{% block content %}
  <header class="hero compact">
    <p class="eyebrow">面试 Demo</p>
    <h1>AI 用药伴侣</h1>
    <p>上传药品包装，确认用法信息，完成提醒记录和安全问答闭环。</p>
  </header>

  <form id="login-form" class="panel form-stack">
    <label>
      邮箱
      <input name="email" type="email" value="demo@blankhoney.xyz" autocomplete="username" required>
    </label>
    <label>
      密码
      <input name="password" type="password" value="Demo123456!" autocomplete="current-password" required>
    </label>
    <button class="primary-action" type="submit">进入 Demo</button>
    <p class="notice">仅用于功能演示。不要上传真实身份证、病历、医保或其他隐私资料。</p>
    <p id="login-message" class="form-message" role="status"></p>
  </form>
{% endblock %}
