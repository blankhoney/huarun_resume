<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI 用药伴侣{% endblock %}</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body data-page="{{ page_id }}">
    <main class="app-shell">
      <section class="screen">
        {% block content %}{% endblock %}
      </section>
      {% if not hide_nav %}
        <nav class="bottom-nav" aria-label="主导航">
          <a href="/" class="{% if page_id == 'home' %}active{% endif %}">首页</a>
          <a href="/pillbox" class="{% if page_id == 'pillbox' %}active{% endif %}">药箱</a>
          <a href="/reminders" class="{% if page_id == 'reminders' %}active{% endif %}">提醒</a>
          <a href="/qa" class="{% if page_id == 'qa' %}active{% endif %}">问答</a>
        </nav>
      {% endif %}
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
